services:
  career-agent:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: career-agent
    container_name: career-agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Your career data lives on the host (editable, survives rebuilds).
      - ./memory:/app/memory
      - ./resumes:/app/resumes
      - ./data:/app/data
      # Keep CLAUDE.md edits live without rebuilding.
      - ./CLAUDE.md:/app/CLAUDE.md:ro
      # Tool lockdown config, live-editable.
      - ./opencode.json:/app/opencode.json:ro
      # OpenCode's own state (sessions, auth), persisted across restarts.
      - opencode_state:/home/appuser/.local/share/opencode

volumes:
  opencode_state:
